openapi: 3.0.3
info:
  title: Society API
  version: 0.1.0
  description: |
    API propia de Society. Los clientes (app Android y panel web) solo hablan con esta API.
    Este contrato documenta únicamente nuestras rutas `/api/v1/...`, no las de Google.
servers:
  - url: /api/v1
tags:
  - name: Places
    description: Búsqueda de locales y fotos.

paths:
  /places/search:
    get:
      operationId: buscarLugares
      summary: Buscar locales por texto
      description: |
        Busca locales por texto y devuelve una página de resultados. Alimenta la pantalla
        02 «Busca tu local»: la lista se carga de forma lazy, pidiendo la página siguiente
        con `pageToken` mientras exista `nextPageToken`.

        Cada resultado trae solo los campos de la tarjeta: `placeId`, `nombre`,
        `direccion`, `valoracion`, `numResenas`, `fotoName` y `googleMapsUri`.

        Si la búsqueda no encuentra locales, responde 200 con `resultados` vacío (estado
        «vacío» de la pantalla). Un texto vacío es un 400.

        Internamente la API llama a Google Places (Text Search, `POST /v1/places:searchText`)
        con un `X-Goog-FieldMask` que limita la respuesta a `id`, `displayName`,
        `formattedAddress`, `rating`, `userRatingCount`, `photos`, `googleMapsUri` y
        `nextPageToken`.

        La clave de Google solo vive en el servidor (D-05) y nunca llega al cliente.

        No se guarda nada: ni la búsqueda ni los resultados (D-06).
      tags: [Places]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Nombre del local o zona. Si viene vacío, la respuesta es 400.
          schema:
            type: string
            minLength: 1
        - name: pageToken
          in: query
          required: false
          description: Token de la página siguiente (`nextPageToken` de una respuesta anterior).
          schema:
            type: string
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusquedaRespuesta'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'

  /places/photo:
    get:
      operationId: obtenerFotoLugar
      summary: Obtener la URL de la foto de un local y sus atribuciones
      description: |
        Devuelve la URL de una foto para pintar la imagen de la tarjeta de local, junto con
        los autores de la foto, que hay que mostrar cuando existan.

        Internamente la API llama a Google Places (Place Photos,
        `GET /v1/{name}/media?skipHttpRedirect=true`).

        La clave de Google solo vive en el servidor (D-05) y nunca llega al cliente.

        No se guarda nada: ni la foto ni su URL (D-06).
      tags: [Places]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: true
          description: Valor de `fotoName` de un resultado de `/places/search`.
          schema:
            type: string
        - name: maxWidthPx
          in: query
          required: true
          description: Ancho máximo de la imagen en píxeles.
          schema:
            type: integer
            minimum: 1
            maximum: 4800
      responses:
        '200':
          description: URL de la foto y sus atribuciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FotoRespuesta'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de la sesión (se obtiene con la API de acceso, no directamente de Supabase).

  schemas:
    BusquedaRespuesta:
      type: object
      required: [resultados]
      properties:
        resultados:
          type: array
          description: Locales de esta página. Vacío si la búsqueda no encuentra nada.
          items:
            $ref: '#/components/schemas/LugarRespuesta'
        nextPageToken:
          type: string
          description: Ausente cuando no hay más páginas.

    LugarRespuesta:
      type: object
      description: Campos de la tarjeta de un local en la pantalla 02.
      required: [placeId, nombre]
      properties:
        placeId:
          type: string
          description: Identificador del local en Google (`id`).
        nombre:
          type: string
          description: Nombre del local (`displayName.text`).
        direccion:
          type: string
          description: Dirección postal (`formattedAddress`).
        valoracion:
          type: number
          format: float
          description: Media de reseñas (`rating`). Ausente si el local no tiene reseñas.
        numResenas:
          type: integer
          description: Número total de reseñas (`userRatingCount`).
        fotoName:
          type: string
          description: |
            Referencia de una foto del local (`photos[].name`). Se pasa como `name` a
            `/places/photo`. Ausente si el local no tiene fotos.
        googleMapsUri:
          type: string
          format: uri
          description: Enlace al local en Google Maps.

    FotoRespuesta:
      type: object
      required: [photoUri, atribuciones]
      properties:
        photoUri:
          type: string
          format: uri
        atribuciones:
          type: array
          description: Autores de la foto. Vacío si no constan.
          items:
            $ref: '#/components/schemas/Atribucion'

    Atribucion:
      type: object
      description: Autor de una foto.
      required: [nombre]
      properties:
        nombre:
          type: string
          description: Nombre del autor.
        uri:
          type: string
          format: uri
          description: Perfil del autor. Ausente si no consta.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              description: |
                Código común de error. Android y la web lo traducen a su error interno.
                En estas rutas: `VALIDACION`, `SESION_CADUCADA`, `LIMITE_ALCANZADO`
                y `PROVEEDOR_NO_DISPONIBLE`.
            message:
              type: string
              description: Mensaje legible. Nunca incluye claves ni respuestas de Google.
            retryable:
              type: boolean
              description: |
                Indica si tiene sentido reintentar. Los GET se reintentan hasta 3 veces;
                los POST nunca de forma automática.

  responses:
    Error400:
      description: Petición incorrecta, por ejemplo texto de búsqueda vacío.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: JWT ausente, caducado o no válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Demasiadas peticiones.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: El proveedor (API de Google) no está disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
