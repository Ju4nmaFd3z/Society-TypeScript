<div class="fixed inset-0 z-50 flex items-center justify-center bg-tinta/40 p-espacio-16">
  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-edicion-campo"
    class="cristal-denso w-full max-w-md rounded-modal p-espacio-16"
  >
    <h2 id="titulo-edicion-campo" class="font-display text-titulo-cifra-22 text-tinta">Editar {{ etiqueta.toLowerCase() }}</h2>

    <form class="mt-espacio-14 flex flex-col gap-espacio-14" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <app-campo-cristal [etiqueta]="etiqueta" [ayuda]="ayuda" [control]="formulario.controls.texto" [error]="errorTexto" />

      @if (error) {
        <p class="text-cuerpo-secundario-12-5 text-alerta">{{ error }}</p>
      }

      <div class="flex justify-end gap-espacio-8">
        <app-boton variante="secundario" [deshabilitado]="guardando" (click)="cancelar.emit()">Cancelar</app-boton>
        <app-boton tipo="submit" [deshabilitado]="guardando">{{ guardando ? 'Guardando…' : 'Guardar' }}</app-boton>
      </div>
    </form>
  </div>
</div>
