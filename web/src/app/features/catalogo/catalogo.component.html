<div class="pared min-h-screen p-espacio-16">
  <div class="relative mx-auto flex max-w-3xl flex-col gap-espacio-16">
    <h1 class="font-display text-titulo-grande-31 text-tinta">Catálogo de componentes</h1>

    <app-tarjeta-cristal densidad="denso">
      <h2 class="font-display text-titulo-cifra-22 text-tinta">Botones</h2>
      <div class="mt-espacio-12 flex gap-espacio-12">
        <app-boton>Continuar</app-boton>
        <app-boton variante="secundario">Cancelar</app-boton>
      </div>
    </app-tarjeta-cristal>

    <app-tarjeta-cristal densidad="denso">
      <h2 class="font-display text-titulo-cifra-22 text-tinta">Campos y casilla</h2>
      <div class="mt-espacio-12 flex flex-col gap-espacio-14">
        <app-campo-cristal etiqueta="Nombre del local" marcador="Bar El Boquerón Dorado" ayuda="Como aparece en Google." [control]="nombre" />
        <app-campo-cristal etiqueta="Correo electrónico" tipo="email" error="Escribe un correo válido." [control]="correo" />
        <app-casilla [control]="propietario">Soy propietario o gestor</app-casilla>
      </div>
    </app-tarjeta-cristal>

    <app-tarjeta-cristal densidad="denso">
      <h2 class="font-display text-titulo-cifra-22 text-tinta">Chips</h2>
      <div class="mt-espacio-12 flex gap-espacio-8">
        <app-chip [activo]="chipActivo === 1" (pulsado)="chipActivo = 1">Primero</app-chip>
        <app-chip [activo]="chipActivo === 2" (pulsado)="chipActivo = 2">Segundo</app-chip>
      </div>
    </app-tarjeta-cristal>

    <app-tarjeta-cristal densidad="denso">
      <h2 class="font-display text-titulo-cifra-22 text-tinta">Etiquetas</h2>
      <div class="mt-espacio-12 flex flex-wrap gap-espacio-16">
        <app-etiqueta-origen origen="google" />
        <app-etiqueta-origen origen="tu-web" />
        <app-etiqueta-origen origen="ia" />
        <app-etiqueta-origen origen="tu" />
      </div>
      <div class="mt-espacio-12 flex flex-wrap gap-espacio-16">
        <app-etiqueta-confianza confianza="observado" />
        <app-etiqueta-confianza confianza="estimado" />
        <app-etiqueta-confianza confianza="hipotesis" />
      </div>
      <div class="mt-espacio-12 flex flex-wrap gap-espacio-16">
        <app-etiqueta-estado estado="prevista" />
        <app-etiqueta-estado estado="publicada" />
        <app-etiqueta-estado estado="generada" />
        <app-etiqueta-estado estado="borrador" />
      </div>
    </app-tarjeta-cristal>

    <div class="grid gap-espacio-16 sm:grid-cols-3">
      <app-tarjeta-cristal densidad="claro">Cristal claro</app-tarjeta-cristal>
      <app-tarjeta-cristal densidad="estandar">Cristal estándar</app-tarjeta-cristal>
      <app-tarjeta-cristal densidad="denso" [destacada]="true">Cristal denso, destacada</app-tarjeta-cristal>
    </div>

    <app-tarjeta-cristal densidad="denso">
      <h2 class="font-display text-titulo-cifra-22 text-tinta">Cargando</h2>
      <div class="mt-espacio-12"><app-estado-cargando /></div>
    </app-tarjeta-cristal>

    <app-tarjeta-cristal densidad="denso">
      <app-estado-vacio titulo="Aún no hay piezas este mes" mensaje="Crea tu primera pieza de contenido.">
        <app-boton>Crear contenido</app-boton>
      </app-estado-vacio>
    </app-tarjeta-cristal>

    <app-tarjeta-cristal densidad="denso">
      <app-estado-error (reintentar)="reintentos = reintentos + 1" />
      <p class="text-center text-cuerpo-pequeno-11-5 text-texto-terciario">Reintentos: {{ reintentos }}</p>
    </app-tarjeta-cristal>
  </div>
</div>
