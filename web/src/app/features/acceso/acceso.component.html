<div class="pared flex min-h-screen items-center justify-center p-espacio-16">
  <div class="relative w-full max-w-md">
    <app-tarjeta-cristal densidad="denso" [destacada]="true">
      <h1 class="font-display text-titulo-pantalla-24 text-tinta">Tu cuenta</h1>
      <p class="mt-espacio-6 text-cuerpo-secundario-12-5 text-texto-secundario">
        Crea tu cuenta o entra para guardar tu local y tu contenido.
      </p>

      <!-- Selector: crear cuenta o iniciar sesión -->
      <div class="mt-espacio-16 flex gap-espacio-8">
        <app-chip [activo]="modo === 'crear'" (pulsado)="cambiarModo('crear')">Crear cuenta</app-chip>
        <app-chip [activo]="modo === 'entrar'" (pulsado)="cambiarModo('entrar')">Iniciar sesión</app-chip>
      </div>

      <form class="mt-espacio-16 flex flex-col gap-espacio-14" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
        <app-campo-cristal
          etiqueta="Correo electrónico"
          tipo="email"
          marcador="nombre@correo.es"
          [control]="formulario.controls.correo"
          [error]="errorCorreo"
        />

        <div>
          <app-campo-cristal
            etiqueta="Contraseña"
            [tipo]="verContrasena ? 'text' : 'password'"
            [control]="formulario.controls.contrasena"
            [ayuda]="modo === 'crear' ? 'Mínimo 8 caracteres.' : ''"
            [error]="errorContrasena"
          />
          <button
            type="button"
            class="mt-espacio-6 text-cuerpo-pequeno-11-5 font-bold text-azul underline"
            (click)="verContrasena = !verContrasena"
          >
            {{ verContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña' }}
          </button>
        </div>

        @if (modo === 'crear') {
          <app-casilla [control]="formulario.controls.terminos" [error]="errorTerminos">
            Acepto los términos y la política de privacidad
          </app-casilla>
        }

        @if (mensajeError) {
          <p class="text-cuerpo-secundario-12-5 text-alerta">{{ mensajeError }}</p>
        }

        <app-boton tipo="submit" [anchoCompleto]="true">Continuar</app-boton>
      </form>
    </app-tarjeta-cristal>
  </div>
</div>
